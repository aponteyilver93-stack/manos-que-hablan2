<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manos que Hablan</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2024.9.2/core.css">
<script type="module" src="https://pyscript.net/releases/2024.9.2/core.js"></script>
<style>
:root{--fondo:#eef4ff;--tarjeta:#fff;--texto:#10223f;--principal:#ffd400;--secundario:#dbe7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:Arial,sans-serif}
#app{max-width:520px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:var(--secundario);padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:21px}
#main{padding:14px 16px 35px}
button{display:block;width:100%;margin:9px 0;padding:14px;border:0;border-radius:14px;background:var(--principal);color:#111;font-size:16px;font-weight:bold}
input{display:block;width:100%;padding:13px;margin:8px 0;border:2px solid var(--principal);border-radius:12px;font-size:17px}
.card{background:var(--tarjeta);padding:16px;margin:10px 0;border-radius:18px;box-shadow:0 2px 9px #0001}
.big{text-align:center;font-size:64px}.word{text-align:center;font-size:28px;font-weight:bold}.desc{text-align:center;font-size:18px;line-height:1.45}
h2{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{min-height:90px}
.out{text-align:center;min-height:32px;padding:8px;border-radius:10px;font-size:19px}
.rowitem{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding:9px 0}
.rowitem button{width:auto;margin:0;padding:8px 11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left}
.small{text-align:center;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="app">
<header><b>🤟 Manos que hablan</b><span>🐍</span></header>
<main id="main"></main>
</div>
<script type="py" src="./main.py" config="./pyscript.json"></script>
</body>
</html>
